name: Stage3 Cancel Stuck

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-cancel-stuck.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Stage3 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ngotuannd92/rasoathopdong/actions/runs/33101953274/cancel
