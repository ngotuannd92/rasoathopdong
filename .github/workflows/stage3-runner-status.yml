name: Stage3 Runner Status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-status.yml

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query self-hosted runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ngotuannd92/rasoathopdong/actions/runners
