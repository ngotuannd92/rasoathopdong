name: Stage3 Fix Test Isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-test-isolation:
    runs-on: self-hosted
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - name: Isolate Windows temp fixtures and run targeted regression
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $source = 'C:\Stage3-Work\source-current'
          $logRoot = 'C:\Stage3-Work\logs\targeted'
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          Push-Location $source
          try {
            function Edit-File([string]$path, [scriptblock]$edit) {
              $text = [IO.File]::ReadAllText($path)
              $updated = & $edit $text
              if ($updated -eq $text) { throw "No edit applied to $path" }
              [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
            }
            function Replace-Required([string]$text,[string]$old,[string]$new,[int]$count) {
              $found = ([regex]::Matches($text,[regex]::Escape($old))).Count
              if ($found -ne $count) { throw "Expected $count occurrence(s), found $found." }
              return $text.Replace($old,$new)
            }
            $tempHelper = @(
              '    private static string GetTestTempPath()',
              '    {',
              '        var runnerTemp = Environment.GetEnvironmentVariable("RUNNER_TEMP");',
              '        return string.IsNullOrWhiteSpace(runnerTemp) ? Path.GetTempPath() : runnerTemp;',
              '    }',
              ''
            ) -join "`n"

            $publish = 'tests\RasoatHopDong.Tests\Stage7PublishContractTests.cs'
            if ([IO.File]::ReadAllText($publish).Contains('private static string GetTestTempPath()')) {
              Write-Output 'PUBLISH_FIX=already-applied'
            } else {
              Edit-File $publish {
                param($text)
                $text = Replace-Required $text 'Path.GetTempPath()' 'GetTestTempPath()' 2
                return Replace-Required $text '    private static string CreateTempRoot()' ($tempHelper + "`n    private static string CreateTempRoot()") 1
              }
              Write-Output 'PUBLISH_FIX=applied'
            }

            $installer = 'tests\RasoatHopDong.Tests\Stage7InstallerContractTests.cs'
            if ([IO.File]::ReadAllText($installer).Contains('private static string GetTestTempPath()')) {
              Write-Output 'INSTALLER_FIX=already-applied'
            } else {
              Edit-File $installer {
                param($text)
                $text = Replace-Required $text 'Path.GetTempPath()' 'GetTestTempPath()' 6
                return Replace-Required $text '    private static void DeleteTempRoot(string root)' ($tempHelper + "`n    private static void DeleteTempRoot(string root)") 1
              }
              Write-Output 'INSTALLER_FIX=applied'
            }

            git diff --check *> (Join-Path $logRoot 'test-isolation-diff-check.log')
            if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

            $oldPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & dotnet build .\rasoathopdong.sln -c Debug --no-restore --nologo *> (Join-Path $logRoot 'test-isolation-build.log')
            $buildCode = $LASTEXITCODE
            if ($buildCode -eq 0) {
              & dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'FullyQualifiedName~Stage7PublishContractTests|FullyQualifiedName~Stage7InstallerContractTests' --logger 'console;verbosity=minimal' *> (Join-Path $logRoot 'test-isolation-stage7.log')
              $testCode = $LASTEXITCODE
            } else { $testCode = 999 }
            $ErrorActionPreference = $oldPreference

            Write-Output "BUILD_EXIT=$buildCode TEST_EXIT=$testCode"
            if ($testCode -eq 0) {
              git add $publish $installer *> $null
              git commit -m 'test(stage3): isolate Windows runner temp fixtures' *> (Join-Path $logRoot 'test-isolation-commit.log')
              if ($LASTEXITCODE -ne 0) { throw 'Local test-isolation commit failed.' }
              Write-Output "LOCAL_COMMIT=$((git rev-parse HEAD).Trim())"
              Get-Content (Join-Path $logRoot 'test-isolation-stage7.log') | Where-Object { $_ -match 'Passed!|Failed!|Total tests|Test Run Successful|Test Run Failed' } | Select-Object -Last 8
            } else {
              Get-Content (Join-Path $logRoot 'test-isolation-stage7.log') -Tail 60 -ErrorAction SilentlyContinue
              throw 'Targeted Stage7 regression failed after test-isolation fix.'
            }
          }
          finally { Pop-Location }
