name: Stage3 Targeted Regression

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Diagnose Stage7 publish migration regression
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $source = 'C:\Stage3-Work\source-current'
          $logRoot = 'C:\Stage3-Work\logs\targeted'
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          Push-Location $source
          try {
            Write-Output "TEMP=$([IO.Path]::GetTempPath())"
            Write-Output "RUNNER_TEMP=$env:RUNNER_TEMP"
            $log = Join-Path $logRoot 'stage7-publish-schema1.log'
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'FullyQualifiedName=RasoatHopDong.Tests.Stage7PublishContractTests.PrepareOutput_ShouldMigrateSchema1MarkerOnlyWhenOutputIsEmpty' --logger 'console;verbosity=detailed' *> $log
            $code = $LASTEXITCODE
            $ErrorActionPreference = $old
            Write-Output "TARGETED_EXIT=$code"
            Get-Content $log -Tail 80 | ForEach-Object {
              $_ -replace [regex]::Escape($env:USERPROFILE), '<USERPROFILE>' -replace [regex]::Escape($env:RUNNER_TEMP), '<RUNNER_TEMP>'
            }
            exit $code
          }
          finally { Pop-Location }
