name: Stage3 Core E2E Gates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-e2e:
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Run Review Compare Benchmark and criteria runtime gates
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $source = 'C:\Stage3-Work\source-current'
          $logRoot = 'C:\Stage3-Work\logs\core-e2e'
          $fixtureRoot = 'C:\Stage3-Work\fixtures\stage2-runtime'
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          if (Test-Path $fixtureRoot) { Remove-Item $fixtureRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $fixtureRoot -Force | Out-Null
          Push-Location $source
          try {
            function Run-Native([string]$name,[scriptblock]$command) {
              $log = Join-Path $logRoot ($name + '.log')
              $old = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & $command *> $log
              $code = $LASTEXITCODE
              $ErrorActionPreference = $old
              Write-Output "GATE=$name EXIT=$code"
              if ($code -ne 0) {
                Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
                throw "$name failed."
              }
              Get-Content $log -ErrorAction SilentlyContinue | Where-Object { $_ -match 'Passed!|Failed!|Total tests:|Test Run Successful|PASS|PASSED' } | Select-Object -Last 12
            }

            Run-Native 'phase2-static' { python .\scripts\verify-phase2-static.py }
            Run-Native 'phase2-content-quality' { python .\scripts\verify-phase2-content-quality.py }
            Run-Native 'phase2-targeted-semantics' { python .\scripts\verify-phase2-targeted-semantics.py }
            Run-Native 'phase2-compare-corpus' { python .\scripts\verify-phase2-compare-corpus.py }
            Run-Native 'phase2-golden-semantics' { python .\scripts\verify-phase2-golden-semantics.py }

            Run-Native 'candidate-runtime' { dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'Stage2Runtime=Candidate' --logger 'console;verbosity=minimal' }
            Run-Native 'current-fixture' { dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'Stage2Runtime=CurrentFixture' --logger 'console;verbosity=minimal' }

            $env:STAGE2_POST_PROMOTION = '1'
            $exactFilter = 'FullyQualifiedName~Stage2PostPromotionRuntimeGateTests.ExactOfficialReviewGolden|FullyQualifiedName~Stage2PostPromotionRuntimeGateTests.ExactOfficialCompareCorpus|FullyQualifiedName~Stage2PostPromotionRuntimeGateTests.ExactOfficialBenchmarkV3|FullyQualifiedName~Stage2PostPromotionRuntimeGateTests.ExactOfficialHistoryAndExports'
            Run-Native 'exact-official-e2e' { dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter $exactFilter --logger 'console;verbosity=minimal' }

            $env:STAGE2_RUNTIME_FIXTURE_DIR = $fixtureRoot
            $env:STAGE2_PREPARE_MIGRATION_FIXTURE = '1'
            Run-Native 'prepare-migration-fixture' { dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'Stage2Runtime=PrepareMigrationFixture' --logger 'console;verbosity=minimal' }
            $env:STAGE2_PREPARE_MIGRATION_FIXTURE = $null
            $migrationFilter = 'FullyQualifiedName~Stage2PostPromotionRuntimeGateTests.Migration020To030|FullyQualifiedName~Stage2PostPromotionRuntimeGateTests.Migration010To030'
            Run-Native 'catalog-migration-preservation' { dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter $migrationFilter --logger 'console;verbosity=minimal' }

            Write-Output "CORE_E2E=PASS LOCAL_HEAD=$((git rev-parse HEAD).Trim())"
          }
          finally {
            $env:STAGE2_POST_PROMOTION = $null
            $env:STAGE2_RUNTIME_FIXTURE_DIR = $null
            $env:STAGE2_PREPARE_MIGRATION_FIXTURE = $null
            Pop-Location
          }
