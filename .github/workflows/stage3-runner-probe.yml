name: Stage3 Historical Baseline Locate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-baseline:
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Locate immutable Stage7 historical baseline
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $expected = '81bcd973cbbc8f48e16fb3b19d3d24de31422ff23baf21bf09497a1ddd93a7d6'
          $targetDir = 'C:\Stage3-Work\baseline'
          $target = Join-Path $targetDir 'rasoathopdong-v0.2.8-stage7-criteria-validation-implementation-r3.zip'
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          if (Test-Path $target) {
            $existing = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($existing -eq $expected) {
              Write-Output "HISTORICAL_BASELINE=ready SHA256=$existing"
              exit 0
            }
            Remove-Item -LiteralPath $target -Force
          }

          $roots = @(
            (Join-Path $env:USERPROFILE 'Desktop'),
            (Join-Path $env:USERPROFILE 'Documents'),
            (Join-Path $env:USERPROFILE 'Downloads'),
            'C:\Stage3',
            'C:\Stage3-Work',
            'C:\work',
            'C:\src',
            'C:\actions-runner\_work'
          ) | Where-Object { Test-Path $_ } | Select-Object -Unique

          $found = $null
          foreach ($root in $roots) {
            $candidates = Get-ChildItem -LiteralPath $root -Filter 'rasoathopdong-v0.2.8-stage7-criteria-validation-implementation-r3*.zip' -File -Recurse -ErrorAction SilentlyContinue
            foreach ($candidate in $candidates) {
              $hash = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -eq $expected) {
                $found = $candidate.FullName
                break
              }
            }
            if ($found) { break }
          }

          if (-not $found) {
            Write-Output 'HISTORICAL_BASELINE=missing'
            throw 'Required immutable Stage7 historical baseline ZIP was not found on Stage3-Win11.'
          }

          Copy-Item -LiteralPath $found -Destination $target -Force
          $copied = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($copied -ne $expected) { throw 'Copied historical baseline hash mismatch.' }
          Write-Output "HISTORICAL_BASELINE=ready SHA256=$copied"
