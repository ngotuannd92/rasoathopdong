name: Stage3 Historical Baseline Deep Locate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate-baseline:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Search user profiles and local drives for historical baseline
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $expected = '81bcd973cbbc8f48e16fb3b19d3d24de31422ff23baf21bf09497a1ddd93a7d6'
          $targetDir = 'C:\Stage3-Work\baseline'
          $target = Join-Path $targetDir 'rasoathopdong-v0.2.8-stage7-criteria-validation-implementation-r3.zip'
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          if (Test-Path $target) {
            $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -eq $expected) { Write-Output "HISTORICAL_BASELINE=ready SHA256=$hash"; exit 0 }
            Remove-Item -LiteralPath $target -Force
          }

          $roots = [System.Collections.Generic.List[string]]::new()
          foreach ($profile in @(Get-ChildItem 'C:\Users' -Directory -Force -ErrorAction SilentlyContinue)) {
            foreach ($leaf in @('Desktop','Documents','Downloads')) {
              $p = Join-Path $profile.FullName $leaf
              if (Test-Path $p) { $roots.Add($p) }
            }
          }
          foreach ($p in @('C:\Stage3','C:\Stage3-Work','C:\work','C:\src','C:\actions-runner\_work','D:\','E:\')) {
            if (Test-Path $p) { $roots.Add($p) }
          }

          $found = $null
          foreach ($root in @($roots | Select-Object -Unique)) {
            $candidates = @(Get-ChildItem -LiteralPath $root -Filter 'rasoathopdong-v0.2.8-stage7-criteria-validation-implementation-r3*.zip' -File -Recurse -Force -ErrorAction SilentlyContinue)
            foreach ($candidate in $candidates) {
              try { $hash = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } catch { continue }
              if ($hash -eq $expected) { $found = $candidate.FullName; break }
            }
            if ($found) { break }
          }

          if (-not $found) {
            Write-Output 'HISTORICAL_BASELINE=missing-after-deep-search'
            exit 2
          }
          Copy-Item -LiteralPath $found -Destination $target -Force
          $copied = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($copied -ne $expected) { throw 'Copied historical baseline hash mismatch.' }
          Write-Output "HISTORICAL_BASELINE=ready SHA256=$copied"
