name: Stage3 Verify Test Isolation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-isolation:
    runs-on: self-hosted
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - name: Verify and commit Windows temp fixture isolation
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $source = 'C:\Stage3-Work\source-current'
          $logRoot = 'C:\Stage3-Work\logs\targeted'
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          Push-Location $source
          try {
            $publishRelative = 'tests\RasoatHopDong.Tests\Stage7PublishContractTests.cs'
            $installerRelative = 'tests\RasoatHopDong.Tests\Stage7InstallerContractTests.cs'
            $publish = Join-Path $source $publishRelative
            $installer = Join-Path $source $installerRelative
            if (-not [IO.File]::ReadAllText($publish).Contains('private static string GetTestTempPath()')) { throw 'Publish test isolation fix is missing.' }
            if (-not [IO.File]::ReadAllText($installer).Contains('private static string GetTestTempPath()')) { throw 'Installer test isolation fix is missing.' }

            $oldPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & git diff --check *> (Join-Path $logRoot 'test-isolation-diff-check.log')
            $diffCode = $LASTEXITCODE
            & dotnet build .\rasoathopdong.sln -c Debug --no-restore --nologo *> (Join-Path $logRoot 'test-isolation-build.log')
            $buildCode = $LASTEXITCODE
            if ($buildCode -eq 0) {
              & dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'FullyQualifiedName~Stage7PublishContractTests|FullyQualifiedName~Stage7InstallerContractTests' --logger 'console;verbosity=minimal' *> (Join-Path $logRoot 'test-isolation-stage7.log')
              $testCode = $LASTEXITCODE
            } else { $testCode = 999 }
            $ErrorActionPreference = $oldPreference

            Write-Output "DIFF_EXIT=$diffCode BUILD_EXIT=$buildCode TEST_EXIT=$testCode"
            if ($diffCode -ne 0) { throw 'git diff --check failed.' }
            if ($buildCode -ne 0) { Get-Content (Join-Path $logRoot 'test-isolation-build.log') -Tail 50; throw 'Debug build failed.' }
            if ($testCode -ne 0) { Get-Content (Join-Path $logRoot 'test-isolation-stage7.log') -Tail 80; throw 'Targeted Stage7 regression failed.' }

            $ErrorActionPreference = 'Continue'
            & git add -- $publishRelative $installerRelative *> (Join-Path $logRoot 'test-isolation-git-add.log')
            $addCode = $LASTEXITCODE
            if ($addCode -eq 0) {
              & git commit -m 'test(stage3): isolate Windows runner temp fixtures' *> (Join-Path $logRoot 'test-isolation-commit.log')
              $commitCode = $LASTEXITCODE
            } else { $commitCode = 999 }
            $ErrorActionPreference = $oldPreference
            if ($addCode -ne 0 -or $commitCode -ne 0) { throw 'Local commit of test isolation fix failed.' }
            Write-Output "LOCAL_COMMIT=$((git rev-parse HEAD).Trim())"
            Get-Content (Join-Path $logRoot 'test-isolation-stage7.log') | Where-Object { $_ -match 'Passed!|Failed!|Total tests|Test Run Successful|Test Run Failed' } | Select-Object -Last 8
          }
          finally { Pop-Location }
