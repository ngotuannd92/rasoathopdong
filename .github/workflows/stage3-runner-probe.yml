name: Stage3 Harden Service-Runner Tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage3-runner-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-tests:
    runs-on: self-hosted
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Harden service-account path expectation and run Stage7 regression
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $source = 'C:\Stage3-Work\source-current'
          $logRoot = 'C:\Stage3-Work\logs\targeted'
          New-Item -ItemType Directory -Path $logRoot -Force | Out-Null
          Push-Location $source
          try {
            $publishRelative = 'tests\RasoatHopDong.Tests\Stage7PublishContractTests.cs'
            $installerRelative = 'tests\RasoatHopDong.Tests\Stage7InstallerContractTests.cs'
            $installer = Join-Path $source $installerRelative
            $text = [IO.File]::ReadAllText($installer)
            $oldLines = @(
              '            var prefixSibling = Path.Combine(localAppData, "rasoathopdong-old-" + unique);',
              '            var siblingResult = RunBuildScript(prefixSibling, safeOutput, fakeIscc);',
              '            AssertFailed(siblingResult, "does not exist");',
              '            Assert.DoesNotContain("overlaps an application or user-data directory", siblingResult.Output + siblingResult.Error, StringComparison.OrdinalIgnoreCase);'
            ) -join "`n"
            $newLines = @(
              '            var prefixSibling = Path.Combine(localAppData, "rasoathopdong-old-" + unique);',
              '            var siblingResult = RunBuildScript(prefixSibling, safeOutput, fakeIscc);',
              '            var siblingDiagnostic = siblingResult.Output + siblingResult.Error;',
              '            Assert.NotEqual(0, siblingResult.ExitCode);',
              '            Assert.DoesNotContain("overlaps an application or user-data directory", siblingDiagnostic, StringComparison.OrdinalIgnoreCase);',
              '            var canonicalPrefixSibling = Path.GetFullPath(prefixSibling);',
              '            var windowsRoot = Path.GetFullPath(Environment.GetEnvironmentVariable("windir")!).TrimEnd(Path.DirectorySeparatorChar);',
              '            var alsoOperatingSystemProtected = canonicalPrefixSibling.StartsWith(',
              '                windowsRoot + Path.DirectorySeparatorChar, StringComparison.OrdinalIgnoreCase)',
              '                || programRoots.Any(programRoot => canonicalPrefixSibling.StartsWith(',
              '                    Path.GetFullPath(programRoot).TrimEnd(Path.DirectorySeparatorChar) + Path.DirectorySeparatorChar,',
              '                    StringComparison.OrdinalIgnoreCase));',
              '            Assert.Contains(',
              '                alsoOperatingSystemProtected',
              '                    ? "PublishPath must not overlap a Windows, System, or Program Files location"',
              '                    : "does not exist",',
              '                siblingDiagnostic,',
              '                StringComparison.OrdinalIgnoreCase);'
            ) -join "`n"
            if ($text.Contains($oldLines)) {
              $text = $text.Replace($oldLines, $newLines)
              [IO.File]::WriteAllText($installer, $text, [Text.UTF8Encoding]::new($false))
              Write-Output 'SERVICE_PROFILE_ASSERTION=adapted'
            } elseif ($text.Contains('var siblingDiagnostic = siblingResult.Output + siblingResult.Error;')) {
              Write-Output 'SERVICE_PROFILE_ASSERTION=already-adapted'
            } else {
              throw 'Expected installer prefix-sibling assertion block was not found.'
            }

            $oldPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & git diff --check *> (Join-Path $logRoot 'service-profile-diff-check.log')
            $diffCode = $LASTEXITCODE
            & dotnet build .\rasoathopdong.sln -c Debug --no-restore --nologo *> (Join-Path $logRoot 'service-profile-build.log')
            $buildCode = $LASTEXITCODE
            if ($buildCode -eq 0) {
              & dotnet test .\tests\RasoatHopDong.Tests\RasoatHopDong.Tests.csproj -c Debug --no-build --no-restore --nologo --filter 'FullyQualifiedName~Stage7PublishContractTests|FullyQualifiedName~Stage7InstallerContractTests' --logger 'console;verbosity=minimal' *> (Join-Path $logRoot 'service-profile-stage7.log')
              $testCode = $LASTEXITCODE
            } else { $testCode = 999 }
            $ErrorActionPreference = $oldPreference

            Write-Output "DIFF_EXIT=$diffCode BUILD_EXIT=$buildCode TEST_EXIT=$testCode"
            if ($diffCode -ne 0) { throw 'git diff --check failed.' }
            if ($buildCode -ne 0) { Get-Content (Join-Path $logRoot 'service-profile-build.log') -Tail 50; throw 'Debug build failed.' }
            if ($testCode -ne 0) { Get-Content (Join-Path $logRoot 'service-profile-stage7.log') -Tail 90; throw 'Targeted Stage7 regression failed.' }

            $ErrorActionPreference = 'Continue'
            & git add -- $publishRelative $installerRelative *> (Join-Path $logRoot 'service-profile-git-add.log')
            $addCode = $LASTEXITCODE
            if ($addCode -eq 0) {
              & git commit -m 'test(stage3): isolate service-runner path fixtures' *> (Join-Path $logRoot 'service-profile-commit.log')
              $commitCode = $LASTEXITCODE
            } else { $commitCode = 999 }
            $ErrorActionPreference = $oldPreference
            if ($addCode -ne 0 -or $commitCode -ne 0) { throw 'Local commit failed.' }
            Write-Output "LOCAL_COMMIT=$((git rev-parse HEAD).Trim())"
            Get-Content (Join-Path $logRoot 'service-profile-stage7.log') | Where-Object { $_ -match 'Passed!|Failed!|Total tests|Test Run Successful|Test Run Failed' } | Select-Object -Last 8
          }
          finally { Pop-Location }
